site_name: Random Walks & Racing Thoughts
site_url: https://pub.reza.rs
site_author: Reza Rasouli
site_description: Programming, Technology and Machines
copyright: >
  &copy; 2025-2026 Reza Rasouli

nav:
  - Blog: blog.md
  - About: about.md

theme:
  name: material
  language: en
  font:
    code: Lato
  # custom_dir: overrides
  logo: blog/assets/logo-r.webp
  favicon: blog/assets/logo-r.webp

  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
      primary: green
      accent: green

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
      primary: green
      accent: green

  features:
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.footer # Prev/Next page
    - navigation.tracking # Anchor tracking
    - navigation.top # Back to top
    - navigation.sections # Useful for an overview
    - navigation.indexes # Needed for an overview
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - nl2br
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference
