plugins:
   - awesome-pages
   - search
   - redirects:
       redirect_maps:
         'b-2025-05-24-kt-java-nio2-async-channels-p1.md' : 'blog/b-2025-05-24-kt-java-nio2-async-channels-p1.md'
         'b-2025-07-27-kt-java-nio2-async-channels-p2.md': 'blog/b-2025-07-27-kt-java-nio2-async-channels-p2.md'
         'b-2025-08-16-social-life-software-bc-rel-p1.md': 'blog/b-2025-08-16-social-life-software-bc-rel-p1.md'
         'b-2025-08-24-social-life-software-bc-rel-p2.md': 'blog/b-2025-08-24-social-life-software-bc-rel-p2.md'
